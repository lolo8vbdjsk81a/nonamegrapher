services:
  nonamegrapher:
    build: .
    restart: always
    environment:
      VIRTUAL_HOST: graph.minghinlo.me
      LETSENCRYPT_HOST: graph.minghinlo.me
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      VIRTUAL_PORT: "80"
      HTTPS_METHOD: redirect
    expose:
      - "80"
    networks:
      - nginx-proxy-net

networks:
  nginx-proxy-net:
    external: true
